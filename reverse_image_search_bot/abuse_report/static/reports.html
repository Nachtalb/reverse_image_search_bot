<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abuse Reports</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #17181c; color: #e8e8ea; font-size: 15px; line-height: 1.45;
  }
  header { padding: 16px; border-bottom: 1px solid #2a2c33; position: sticky; top: 0; background: #17181c; z-index: 5; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: #9a9ba2; font-size: 13px; }
  main { padding: 16px; }
  .card { background: #1f2128; border: 1px solid #2a2c33; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: #9a9ba2; margin-bottom: 6px; }
  input[type=password], input[type=text], textarea {
    width: 100%; padding: 11px 12px; border-radius: 9px; border: 1px solid #363842;
    background: #14151a; color: #e8e8ea; font-size: 15px;
  }
  button {
    border: none; border-radius: 9px; padding: 11px 16px; font-size: 15px; font-weight: 600;
    cursor: pointer; background: #3a6df0; color: #fff;
  }
  button.ghost { background: transparent; color: #9a9ba2; border: 1px solid #363842; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .muted { color: #9a9ba2; font-size: 12px; }
  .hidden { display: none; }
  .rep {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 11px 12px; border: 1px solid #2a2c33; border-radius: 10px; margin-bottom: 8px;
    background: #1b1d23; cursor: pointer;
  }
  .rep:hover { border-color: #3a6df0; }
  .rep .who { font-weight: 600; }
  .rep .meta { font-size: 12px; color: #9a9ba2; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
  .badge.ready, .badge.preparing { background: #103a2a; color: #7fd6a2; }
  .badge.submitting { background: #4a3a10; color: #f0c674; }
  .badge.filed { background: #0f2f5a; color: #8ab4ff; }
  .badge.cancelled, .badge.error, .badge.retracted, .badge.review { background: #3a1c1c; color: #f0a0a0; }
  .badge.deleted { background: #3a2c10; color: #f0c674; }
  .err { color: #f08a8a; font-size: 13px; margin-top: 8px; }
  code { background: #2a2c33; padding: 1px 5px; border-radius: 4px; }
  code.copyable { cursor: pointer; border: 1px dashed #4a4c56; }
  code.copyable:active { background: #3a6df0; color: #fff; }
  /* Tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { flex: 1; text-align: center; padding: 10px; border-radius: 9px; background: #1f2128; border: 1px solid #2a2c33; color: #9a9ba2; cursor: pointer; font-weight: 600; }
  .tab.active { background: #3a6df0; color: #fff; border-color: #3a6df0; }
  /* Status filter dropdown */
  select { padding: 9px 11px; border-radius: 9px; border: 1px solid #363842; background: #14151a; color: #e8e8ea; font-size: 14px; }
  /* Stats */
  .stat-counter { font-size: 44px; font-weight: 800; line-height: 1; color: #8ab4ff; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .stat-box { background: #1b1d23; border: 1px solid #2a2c33; border-radius: 10px; padding: 14px; }
  .stat-box .n { font-size: 28px; font-weight: 800; color: #8ab4ff; }
  .stat-box .l { font-size: 12px; color: #9a9ba2; margin-top: 2px; }
  .n2 { font-size: 22px; font-weight: 700; color: #cfd0d6; }
  /* Language pie + toggle chips */
  #st-pie path { cursor: default; transition: opacity .12s; }
  .lang-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; color: #fff; user-select: none; }
  .lang-chip.off { opacity: .32; }
  .lang-chip .tick { font-size: 12px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 13px; }
  .bar-row .lbl { width: 92px; flex-shrink: 0; color: #cfd0d6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .bar { height: 16px; background: #3a6df0; border-radius: 4px; min-width: 2px; }
  .bar-row .val { color: #9a9ba2; font-size: 12px; }
  /* Heatmap: 7 rows (Sun–Sat) × 24 hour cols */
  .heat { overflow-x: auto; }
  .heat table { border-collapse: collapse; }
  .heat td, .heat th { width: 15px; height: 15px; text-align: center; font-size: 9px; color: #6a6c76; padding: 0; }
  .heat th.hh { font-size: 8px; }
  .heat td.cell { border-radius: 2px; outline: 1px solid #14151a; }
  .heat td.day { width: 30px; color: #9a9ba2; font-size: 10px; text-align: right; padding-right: 5px; }
  /* Settings gear + dropdown */
  .gear { background: none; border: none; color: #9a9ba2; font-size: 20px; padding: 0 4px; line-height: 1; cursor: pointer; }
  .menu { position: absolute; right: 0; top: 26px; background: #1f2128; border: 1px solid #363842; border-radius: 10px; min-width: 170px; z-index: 20; overflow: hidden; }
  .menu div { padding: 11px 14px; cursor: pointer; }
  .menu div:hover { background: #2a2c33; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #2a2c33; border-radius: 10px; margin-bottom: 8px; background: #1b1d23; }
  .item .nm { font-weight: 600; }
  button.small { padding: 6px 10px; font-size: 13px; }
  button.danger { background: #7a2b2b; }
</style>
</head>
<body>
<header>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
    <div>
      <h1>Abuse Reports</h1>
      <div class="sub" id="hdr-sub">Locked</div>
    </div>
    <div style="position:relative">
      <button class="gear hidden" id="gear-btn" title="Settings">⚙</button>
      <div class="menu hidden" id="gear-menu">
        <div data-open="keys">API keys</div>
        <div data-open="sources">Sources</div>
      </div>
    </div>
  </div>
</header>
<main>
  <!-- Global page password gate -->
  <div class="card" id="unlock-card">
    <input type="password" id="p2" autocomplete="off" placeholder="Report page password">
    <div style="height:10px"></div>
    <button id="unlock-btn">Unlock</button>
    <div class="err" id="unlock-err"></div>
  </div>

  <div id="body" class="hidden">
    <div class="tabs" id="main-tabs">
      <div class="tab active" id="tab-reports" data-tab="reports">Reports</div>
      <div class="tab" id="tab-stats" data-tab="stats">Statistics</div>
    </div>

    <!-- ============ REPORTS TAB ============ -->
    <div id="pane-reports">
      <!-- Create a new report -->
      <div class="card">
        <label for="target">Create a new report</label>
        <div class="row">
          <textarea id="target" rows="1" placeholder="ID, @username, file or URLs" style="flex:1;min-width:180px"></textarea>
          <select id="create-source" title="Source"></select>
          <button id="create-btn">Create</button>
        </div>
        <div class="err" id="create-err"></div>
        <div class="muted hidden" id="create-progress" style="margin-top:8px"></div>
        <div id="create-ok" class="hidden" style="margin-top:10px"></div>
      </div>

      <!-- Waiting list: watchlisted users whose held uploads need a round -->
      <div class="card hidden" id="waiting-card">
        <b>Waiting for a report</b>
        <div class="muted" style="margin:4px 0 10px">
          Held uploads from watched users. They are not served anywhere.
        </div>
        <div id="waiting-list"></div>
      </div>

      <!-- Report list -->
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <b>All reports</b>
          <div class="row">
            <select id="status-filter" title="Filter by status"></select>
            <button class="ghost" id="refresh-btn">Refresh</button>
          </div>
        </div>
        <input type="text" id="list-search" placeholder="Search id, @username, name, report" style="margin-top:10px">
        <div id="list" style="margin-top:10px"></div>
        <div class="muted hidden" id="list-more" style="text-align:center;padding:10px">Loading…</div>
      </div>
    </div>

    <!-- ============ STATISTICS TAB ============ -->
    <div id="pane-stats" class="hidden">
      <div class="tabs" id="st-outcome">
        <div class="tab active" data-outcome="filed">Reported</div>
        <div class="tab" data-outcome="deleted">Deleted</div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:stretch;gap:12px;flex-wrap:nowrap">
          <div style="display:flex;flex-direction:column;justify-content:space-between;min-height:120px;flex:1;min-width:0">
            <div>
              <div class="muted" id="st-counter-label">Total files reported</div>
              <div class="stat-counter" id="st-counter">—</div>
            </div>
            <div class="row" id="st-filebreak" style="gap:0;margin-top:8px;align-items:center;flex-wrap:wrap"></div>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;flex-shrink:0">
            <select id="st-year" title="Year"></select>
            <select id="st-month" title="Month"></select>
          </div>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat-box"><div class="n" id="st-reports">—</div><div class="l" id="st-reports-label">Reports filed</div></div>
        <div class="stat-box"><div class="n" id="st-users">—</div><div class="l">Unique users reported</div></div>
      </div>

      <div class="card">
        <b>Languages</b>
        <div id="st-pie-wrap" style="display:flex;justify-content:center;margin:12px 0">
          <svg id="st-pie" viewBox="0 0 200 200" width="220" height="220" role="img"></svg>
        </div>
        <div class="row" id="st-lang-chips" style="justify-content:center"></div>
      </div>

      <div class="card">
        <b>Sources</b>
        <div style="display:flex;justify-content:center;margin:12px 0">
          <svg id="st-src-pie" viewBox="0 0 200 200" width="220" height="220" role="img"></svg>
        </div>
        <div class="row" id="st-src-legend" style="justify-content:center"></div>
      </div>

      <div class="card">
        <b>Posting Time</b>
        <div class="heat" id="st-heat" style="margin-top:10px"></div>
      </div>

      <div class="err" id="st-err"></div>
    </div>

    <!-- ============ API KEYS ============ -->
    <div id="pane-keys" class="hidden">
      <div class="card">
        <label for="key-name">New API key</label>
        <div class="row">
          <input type="text" id="key-name" placeholder="e.g. cloudflare-feed" style="flex:1;min-width:160px">
          <button id="key-add">Create</button>
        </div>
        <div class="err" id="key-err"></div>
        <div id="key-new" class="hidden" style="margin-top:10px"></div>
      </div>
      <div class="card"><div id="key-list"></div></div>
    </div>

    <!-- ============ SOURCES ============ -->
    <div id="pane-sources" class="hidden">
      <div class="card">
        <label for="src-name">New source</label>
        <div class="row">
          <input type="text" id="src-name" placeholder="e.g. cybertip.ca" style="flex:1;min-width:160px">
          <button id="src-add">Create</button>
        </div>
        <div class="err" id="src-err"></div>
      </div>
      <div class="card"><div id="src-list"></div></div>
    </div>
  </div>
</main>

<script>
const TG = window.Telegram && window.Telegram.WebApp;
if (TG) { TG.ready(); TG.expand(); }
// This IS the overview — hide any Back button Telegram may still be showing
// from a previous report page.
if (TG && TG.BackButton) TG.BackButton.hide();
const INIT = (TG && TG.initData) || "";
let P2 = "";

const $ = id => document.getElementById(id);
const api = async (path, opts = {}) => {
  const headers = Object.assign({ "X-Init-Data": INIT }, opts.headers || {});
  if (P2) headers["X-Page-Secret"] = P2;
  const r = await fetch(`/report/console${path}`, Object.assign({}, opts, { headers }));
  if (!r.ok && r.status !== 409) throw new Error((await r.text()) || r.status);
  return r;
};

$("unlock-btn").onclick = async () => {
  P2 = $("p2").value;
  $("unlock-err").textContent = "";
  try {
    await loadList();  // doubles as the password check
    try { sessionStorage.setItem("ris_report_pw", P2); } catch (e) {}
    $("unlock-card").classList.add("hidden");
    $("body").classList.remove("hidden");
    $("gear-btn").classList.remove("hidden");
    $("hdr-sub").classList.add("hidden");
    loadSources().catch(() => {});
    loadWaiting().catch(() => {});
  } catch (e) { $("unlock-err").textContent = "" + e.message; P2 = ""; }
};

// Auto-unlock from a previous session's saved password. Called at the very END
// of this script: it reaches into state (LIST, …) declared further down, and a
// `let` is in its temporal dead zone until its declaration has been evaluated.
function tryAutoUnlock() {
  let saved = "";
  try { saved = sessionStorage.getItem("ris_report_pw") || ""; } catch (e) {}
  if (saved) { $("p2").value = saved; $("unlock-btn").click(); }
}

function fmtTs(ts) { return ts ? new Date(ts * 1000).toLocaleString() : "—"; }

function openReport(uuid) {
  // Persist the page password so the report page auto-unlocks on arrival.
  try {
    sessionStorage.setItem("ris_report_pw", P2);
  } catch (e) {}
  location.href = `/report/${uuid}`;
}

// ============ Report list (paged + searched server-side) ============
// The history is long, so the list loads a page at a time as you scroll and the
// filtering happens in SQL — paging a client-filtered array would skip matches.
const PAGE = 20;
let LIST = { offset: 0, total: 0, loading: false, done: false, q: "", status: "" };

// Statuses always offered. Anything else (a stuck submit, an errored round) only
// appears while a report is actually in it — the dropdown describes reality.
const CORE_STATUSES = ["filed", "ready", "cancelled", "deleted", "watched"];
const STATUS_LABEL = {
  filed: "Filed", ready: "Ready", cancelled: "Cancelled", deleted: "Deleted", watched: "Watched",
  preparing: "Preparing", review: "Review", submitting: "Submitting", retracted: "Retracted", error: "Error",
};

function fillStatusFilter(counts) {
  const sel = $("status-filter");
  const keep = sel.value;
  const extra = Object.keys(counts || {}).filter(s => !CORE_STATUSES.includes(s) && counts[s]);
  const opts = ['<option value="">All statuses</option>'];
  for (const s of CORE_STATUSES.concat(extra)) {
    opts.push(`<option value="${s}">${escapeHtml(STATUS_LABEL[s] || s)}</option>`);
  }
  sel.innerHTML = opts.join("");
  sel.value = keep;
  if (sel.value !== keep) sel.value = "";  // the kept status no longer exists
}

// Restart the list from the top (new search or filter) and load the first page.
async function loadList() {
  LIST = { offset: 0, total: 0, loading: false, done: false, q: $("list-search").value.trim(), status: $("status-filter").value };
  $("list").innerHTML = "";
  await loadMore();
}

async function loadMore() {
  if (LIST.loading || LIST.done) return;
  LIST.loading = true;
  $("list-more").classList.remove("hidden");
  try {
    const qs = new URLSearchParams({ offset: LIST.offset, limit: PAGE });
    if (LIST.q) qs.set("q", LIST.q);
    if (LIST.status) qs.set("status", LIST.status);
    const j = await (await api("/api/list?" + qs)).json();
    LIST.total = j.total;
    LIST.offset += j.reports.length;
    LIST.done = LIST.offset >= j.total || !j.reports.length;
    fillStatusFilter(j.statuses);
    appendReports(j.reports);
    if (!LIST.offset) {
      $("list").innerHTML = `<div class="muted">${LIST.q || LIST.status ? "No reports match." : "No reports yet."}</div>`;
    }
  } finally {
    LIST.loading = false;
    $("list-more").classList.toggle("hidden", LIST.done);
  }
}

function appendReports(reports) {
  const list = $("list");
  for (const rep of reports) {
    const who = rep.username ? "@" + rep.username : (rep.display_name || rep.user_id);
    const ncmec = rep.ncmec_report_id ? ` · NCMEC #${rep.ncmec_report_id}` : "";
    const el = document.createElement("div");
    el.className = "rep";
    el.innerHTML =
      `<div><div class="who">${escapeHtml(who)} · <span class="muted">${rep.user_id}</span></div>` +
      `<div class="meta"><code>${rep.uuid.slice(0, 8)}</code> · ${fmtTs(rep.created_at)}${ncmec}</div></div>` +
      `<span class="badge ${rep.status}">${rep.status}</span>`;
    el.onclick = () => openReport(rep.uuid);
    list.appendChild(el);
  }
}

// Infinite scroll: pull the next page as the end of the list comes into view.
window.addEventListener("scroll", () => {
  if ($("pane-reports").classList.contains("hidden")) return;
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
    loadMore().catch(() => {});
  }
});

$("status-filter").onchange = () => loadList().catch(e => { $("create-err").textContent = "" + e.message; });

// Debounced so typing doesn't fire a request per keystroke.
let SEARCH_TIMER = null;
$("list-search").oninput = () => {
  clearTimeout(SEARCH_TIMER);
  SEARCH_TIMER = setTimeout(() => loadList().catch(() => {}), 250);
};

// ============ Waiting list ============
// Watchlisted users whose held uploads have nowhere to go until a round exists.
async function loadWaiting() {
  const j = await (await api("/api/waiting")).json();
  const box = $("waiting-list");
  $("waiting-card").classList.toggle("hidden", !j.waiting.length);
  box.innerHTML = "";
  for (const w of j.waiting) {
    const who = w.username ? "@" + w.username : (w.display_name || w.user_id);
    // Why they are watched — a previous outcome, or the ban that followed one.
    const why = w.banned ? "banned" : (STATUS_LABEL[w.last_status] || w.last_status || "watched").toLowerCase();
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML =
      `<div><div class="nm">${escapeHtml(who)} · <span class="muted">${w.user_id}</span></div>` +
      `<div class="muted">${w.held} file(s) · ${why} · since ${fmtTs(w.first_held)}</div></div>`;
    const b = document.createElement("button");
    b.className = "small";
    b.textContent = "Create report";
    b.onclick = () => { $("target").value = String(w.user_id); $("create-btn").click(); };
    el.appendChild(b);
    box.appendChild(el);
  }
}

$("refresh-btn").onclick = () => {
  loadList().catch(e => { $("create-err").textContent = "" + e.message; });
  loadWaiting().catch(() => {});
};

$("create-btn").onclick = async () => {
  $("create-err").textContent = "";
  $("create-ok").classList.add("hidden");
  const target = $("target").value.trim();
  if (!target) { $("create-err").textContent = "Enter a user id, @username, or filename."; return; }
  // The create request blocks until every file is encrypted, which is slow for
  // a big user/group — poll a side channel so the admin sees it move.
  const btn = $("create-btn"); btn.disabled = true;
  const prog = $("create-progress");
  prog.classList.remove("hidden");
  prog.textContent = "⏳ preparing…";
  const poll = setInterval(async () => {
    try {
      const p = await (await api("/api/prepare_progress?target=" + encodeURIComponent(target))).json();
      if (p.progress) prog.textContent = "⏳ encrypting " + p.progress + "…";
    } catch (e) { /* transient — keep polling */ }
  }, 1000);
  try {
    const r = await api("/api/create", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ target, source: $("create-source").value }),
    });
    const j = await r.json();
    // One entry per unique uploader found in the input.
    const ok = $("create-ok");
    ok.classList.remove("hidden");
    ok.innerHTML = "";
    for (const res of j.results || []) {
      const row = document.createElement("div");
      row.style.marginBottom = "10px";
      if (res.uuid) {
        row.innerHTML =
          `<div>🆕 encrypted <b>${res.encrypted}</b> file(s).</div>` +
          `<div style="margin:4px 0">Image key: <code class="copyable" data-copy="${escapeHtml(res.p1)}">${escapeHtml(res.p1)}</code></div>`;
      } else {
        const icon = res.ncmec_report_id ? "✅" : (res.existing_uuid ? "⏳" : "⏭");
        row.innerHTML = `<div>${icon} ${escapeHtml(res.error || "nothing to report")}</div>`;
      }
      const uuid = res.uuid || res.existing_uuid || res.filed_uuid;
      if (uuid) {
        const b = document.createElement("button");
        b.textContent = "Open " + res.user_id;
        b.style.width = "100%";
        b.onclick = () => openReport(uuid);
        row.appendChild(b);
      } else {
        // No report to open — the id has nowhere else to live.
        row.firstChild.innerHTML = `<code>${res.user_id}</code> · ` + row.firstChild.innerHTML;
      }
      ok.appendChild(row);
    }
    if ((j.unknown || []).length) {
      const u = document.createElement("div");
      u.className = "muted";
      u.textContent = `❓ no uploader on record: ${j.unknown.join(", ")}`;
      ok.appendChild(u);
    }
    $("target").value = "";
    loadList().catch(() => {});
    // Creating a round consumes that user's held files — they leave the queue.
    loadWaiting().catch(() => {});
  } catch (e) {
    $("create-err").textContent = "" + e.message;
  } finally {
    clearInterval(poll);
    prog.classList.add("hidden");
    btn.disabled = false;
  }
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Tap a .copyable to copy its data-copy value (clipboard API needs a secure
// context; the textarea fallback covers older Telegram webviews).
document.addEventListener("click", ev => {
  const el = ev.target.closest(".copyable");
  if (!el) return;
  const text = el.dataset.copy || el.textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => {});
    return;
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  ta.remove();
});

// ============ Tabs / panes ============
// Four panes share the body; the two tabs cover reports+stats, the gear menu
// opens keys/sources. showPane() is the single place any of them is switched.
const PANES = ["reports", "stats", "keys", "sources"];

function showPane(name) {
  PANES.forEach(p => $("pane-" + p).classList.toggle("hidden", p !== name));
  $("main-tabs").classList.toggle("hidden", name === "keys" || name === "sources");
  $("main-tabs").querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  if (name === "stats") loadStats().catch(e => { $("st-err").textContent = "" + e.message; });
  if (name === "keys") loadKeys().catch(e => { $("key-err").textContent = "" + e.message; });
  if (name === "sources") loadSources().catch(e => { $("src-err").textContent = "" + e.message; });
}

$("main-tabs").querySelectorAll(".tab").forEach(t => { t.onclick = () => showPane(t.dataset.tab); });

$("gear-btn").onclick = ev => { ev.stopPropagation(); $("gear-menu").classList.toggle("hidden"); };
document.addEventListener("click", ev => {
  const item = ev.target.closest("#gear-menu div");
  if (item) showPane(item.dataset.open);
  if (!ev.target.closest("#gear-btn")) $("gear-menu").classList.add("hidden");
});

// ============ Sources ============
let SOURCES = [];
let DEFAULT_SOURCE = "sweep";

async function loadSources() {
  const j = await (await api("/api/sources")).json();
  SOURCES = j.sources;
  DEFAULT_SOURCE = j.default;
  renderSources();
  fillSourceSelect();
}

// Keep the create dropdown on whatever was selected; default otherwise.
function fillSourceSelect() {
  const sel = $("create-source");
  const keep = sel.value;
  sel.innerHTML = SOURCES.map(s => `<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`).join("");
  sel.value = SOURCES.some(s => s.name === keep) ? keep : DEFAULT_SOURCE;
}

function renderSources() {
  const box = $("src-list");
  box.innerHTML = "";
  for (const s of SOURCES) {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `<div><div class="nm">${escapeHtml(s.name)}</div>` +
      `<div class="muted">${s.reports} report(s) · ${fmtTs(s.created_at)}</div></div>`;
    // The default source is permanent, and a used one is kept so the statistics
    // stay attributable — the server enforces both; no button is offered.
    if (s.name !== DEFAULT_SOURCE && !s.reports) {
      const b = document.createElement("button");
      b.className = "small danger";
      b.textContent = "Delete";
      b.onclick = () => sourceAction({ action: "delete", id: s.id });
      el.appendChild(b);
    }
    box.appendChild(el);
  }
}

async function sourceAction(body) {
  $("src-err").textContent = "";
  try {
    const j = await (await api("/api/sources", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    })).json();
    SOURCES = j.sources;
    DEFAULT_SOURCE = j.default;
    renderSources();
    fillSourceSelect();
  } catch (e) { $("src-err").textContent = "" + e.message; }
}

$("src-add").onclick = async () => {
  const name = $("src-name").value.trim();
  if (!name) { $("src-err").textContent = "Enter a name."; return; }
  await sourceAction({ action: "add", name });
  $("src-name").value = "";
};

// ============ API keys ============
async function loadKeys(newKey) {
  const j = await (await api("/api/keys")).json();
  renderKeys(j.keys, newKey);
}

function renderKeys(keys, newKey) {
  // The key itself only ever exists in this one response — show it until the
  // pane is reloaded, then it is gone for good.
  const nb = $("key-new");
  nb.classList.toggle("hidden", !newKey);
  if (newKey) {
    nb.innerHTML = `<div>Copy it now — it is not shown again.</div>` +
      `<div style="margin-top:4px"><code class="copyable" data-copy="${escapeHtml(newKey)}">${escapeHtml(newKey)}</code></div>`;
  }
  const box = $("key-list");
  box.innerHTML = keys.length ? "" : `<div class="muted">No API keys yet.</div>`;
  for (const k of keys) {
    const used = k.last_used_at ? ` · used ${fmtTs(k.last_used_at)}` : "";
    const rotated = k.rotated_at ? ` · rotated ${fmtTs(k.rotated_at)}` : "";
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `<div><div class="nm">${escapeHtml(k.name)}</div>` +
      `<div class="muted"><code>${escapeHtml(k.key_preview)}</code> · ${fmtTs(k.created_at)}${rotated}${used}</div></div>`;
    const row = document.createElement("div");
    row.className = "row";
    for (const [label, body, cls] of [
      ["Revoke", { action: "rotate", id: k.id }, "small ghost"],
      ["Delete", { action: "delete", id: k.id }, "small danger"],
    ]) {
      const b = document.createElement("button");
      b.className = cls;
      b.textContent = label;
      b.onclick = () => keyAction(body);
      row.appendChild(b);
    }
    el.appendChild(row);
    box.appendChild(el);
  }
}

async function keyAction(body) {
  $("key-err").textContent = "";
  try {
    const j = await (await api("/api/keys", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    })).json();
    renderKeys(j.keys, j.new_key);
  } catch (e) { $("key-err").textContent = "" + e.message; }
}

$("key-add").onclick = async () => {
  const name = $("key-name").value.trim();
  if (!name) { $("key-err").textContent = "Enter a name."; return; }
  await keyAction({ action: "add", name });
  $("key-name").value = "";
};

// ============ Statistics ============
let STATS = null;  // raw records from the server (decided reports: filed + deleted)
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
// Which outcome the whole dashboard is showing. Filed reports went to NCMEC;
// deleted ones destroyed the material without filing.
let STATS_OUTCOME = "filed";

function fmtLang(code) {
  if (!code) return "Unknown";
  try {
    const dn = new Intl.DisplayNames([navigator.language || "en"], { type: "language" });
    const name = dn.of(code);
    return name && name.toLowerCase() !== code.toLowerCase() ? `${name} (${code})` : code;
  } catch (e) { return code; }
}

async function loadStats() {
  $("st-err").textContent = "";
  if (!STATS) {
    const r = await api("/api/stats");
    STATS = (await r.json()).records || [];
    buildPeriodDropdowns();
  }
  renderStats();
}

// Year dropdown = every year that has a decided report (desc). Month dropdown =
// "Full year" + Jan..current (current year capped at this month; past years all 12).
function buildPeriodDropdowns() {
  const now = new Date();
  const years = [...new Set(STATS.map(r => new Date(r.finished_at * 1000).getFullYear()))].sort((a, b) => b - a);
  if (!years.includes(now.getFullYear())) years.unshift(now.getFullYear());
  const ysel = $("st-year");
  ysel.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join("");
  ysel.value = String(years[0]);
  ysel.onchange = () => { buildMonthDropdown(); renderStats(); };
  buildMonthDropdown();
}

function buildMonthDropdown() {
  const now = new Date();
  const year = parseInt($("st-year").value, 10);
  const lastMonth = year === now.getFullYear() ? now.getMonth() : 11;  // cap current year
  let opts = `<option value="all">Full year</option>`;
  for (let m = 0; m <= lastMonth; m++) opts += `<option value="${m}">${MONTHS[m]}</option>`;
  $("st-month").innerHTML = opts;
  $("st-month").value = "all";
  $("st-month").onchange = renderStats;
}

// Records filtered to the selected outcome + year + (optional) month.
function selectedRecords() {
  const year = parseInt($("st-year").value, 10);
  const month = $("st-month").value;
  return STATS.filter(r => {
    if (r.status !== STATS_OUTCOME) return false;
    const d = new Date(r.finished_at * 1000);
    if (d.getFullYear() !== year) return false;
    if (month !== "all" && d.getMonth() !== parseInt(month, 10)) return false;
    return true;
  });
}

document.querySelectorAll("#st-outcome .tab").forEach(t => {
  t.onclick = () => {
    STATS_OUTCOME = t.dataset.outcome;
    document.querySelectorAll("#st-outcome .tab").forEach(o => o.classList.toggle("active", o === t));
    renderStats();
  };
});

function renderStats() {
  const recs = selectedRecords();
  // Aggregate file counts by their ACTUAL type (no forcing).
  const byType = {};
  let total = 0;
  for (const r of recs) {
    for (const [t, n] of Object.entries(r.file_types || {})) { byType[t] = (byType[t] || 0) + n; total += n; }
  }
  $("st-counter").textContent = total;
  $("st-counter-label").textContent = STATS_OUTCOME === "filed" ? "Total files reported" : "Total files deleted";
  $("st-reports-label").textContent = STATS_OUTCOME === "filed" ? "Reports filed" : "Reports deleted";
  renderFileBreakdown(byType);
  $("st-reports").textContent = recs.length;
  $("st-users").textContent = new Set(recs.map(r => r.user_id)).size;
  renderLangPie(recs);
  renderSourcePie(recs);
  renderHeatmap(recs);
}

// Nice labels for the recorded Telegram file types.
const FILE_TYPE_LABEL = { photo: "Photos", video: "Videos", sticker: "Stickers", gif: "GIFs", document: "Documents", unknown: "Unknown" };

// One cell per file type actually present, separated by a thin divider line.
function renderFileBreakdown(byType) {
  const box = $("st-filebreak");
  box.innerHTML = "";
  const order = ["photo", "video", "sticker", "gif", "document", "unknown"];
  const types = order.filter(t => byType[t]).concat(Object.keys(byType).filter(t => !order.includes(t)));
  if (!types.length) { box.innerHTML = `<span class="muted">No files.</span>`; return; }
  types.forEach((t, i) => {
    if (i) box.insertAdjacentHTML("beforeend", `<div style="width:1px;height:34px;background:#363842;margin:0 14px"></div>`);
    box.insertAdjacentHTML("beforeend",
      `<div style="text-align:center"><div class="n2">${byType[t]}</div>` +
      `<div class="l">${escapeHtml(FILE_TYPE_LABEL[t] || t)}</div></div>`);
  });
}

// Palette for pie slices (cycled). Toggling a chip drops that key from the pie
// and the percentages recompute over the remaining visible ones.
const PIE_COLORS = ["#54a0ff", "#3a6df0", "#8ac926", "#ffca3a", "#ff6b6b", "#a78bfa", "#26c6da", "#ff9f43", "#c44dff", "#95a5a6"];

// One toggleable pie: which keys are hidden, and the animation state for the
// slice tween. Languages and sources are the same widget over a different field,
// so they share everything except this state (and it must stay separate, or
// hiding "en" would hide a source too).
function pieState() { return { off: new Set(), cur: {}, raf: null }; }
const PIES = { lang: pieState(), src: pieState() };

// Draw a toggleable pie: counts by key, a chip per key that hides/shows its
// slice, animated. `label` renders a key for humans.
function renderTogglePie(state, svgId, chipsId, counts, label) {
  // Stable order: biggest first, so colors stay put as the period changes.
  const keys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const color = {};
  keys.forEach((k, i) => { color[k] = PIE_COLORS[i % PIE_COLORS.length]; });

  const chips = $(chipsId);
  chips.innerHTML = "";
  if (!keys.length) chips.innerHTML = `<div class="muted">No data for this period.</div>`;
  for (const k of keys) {
    const chip = document.createElement("button");
    chip.className = "lang-chip" + (state.off.has(k) ? " off" : "");
    chip.style.background = color[k];
    chip.innerHTML = `<span class="tick">${state.off.has(k) ? "" : "✓"}</span>${escapeHtml(label(k))}`;
    chip.onclick = () => {
      if (state.off.has(k)) state.off.delete(k); else state.off.add(k);
      drawPie(state, svgId, counts, keys, color, label);
      paintChips(chipsId, state, keys);
    };
    chips.appendChild(chip);
  }
  drawPie(state, svgId, counts, keys, color, label);
}

function renderLangPie(recs) {
  const counts = {};
  for (const r of recs) { const k = r.language || ""; counts[k] = (counts[k] || 0) + 1; }
  renderTogglePie(PIES.lang, "st-pie", "st-lang-chips", counts, fmtLang);
}

// Filed/deleted reports per source — same toggleable widget as the languages.
function renderSourcePie(recs) {
  const counts = {};
  for (const r of recs) { const k = r.source || "—"; counts[k] = (counts[k] || 0) + 1; }
  renderTogglePie(PIES.src, "st-src-pie", "st-src-legend", counts, k => k);
}

function paintChips(chipsId, state, keys) {
  const chips = [...$(chipsId).querySelectorAll(".lang-chip")];
  keys.forEach((k, i) => {
    const off = state.off.has(k);
    chips[i].classList.toggle("off", off);
    chips[i].querySelector(".tick").textContent = off ? "" : "✓";
  });
}

// Draw/animate the pie over only the keys NOT toggled off; the visible slices'
// percentages recompute and the transition is animated (tweened via rAF; an SVG
// path `d` can't be CSS-animated).
function drawPie(state, svgId, counts, keys, color, label) {
  const visible = keys.filter(k => !state.off.has(k));
  const total = visible.reduce((s, k) => s + counts[k], 0);
  // Target fraction per key (0 for hidden/empty). New keys start at 0 → grow in.
  const target = {};
  for (const k of keys) { if (!(k in state.cur)) state.cur[k] = 0; target[k] = total ? (state.off.has(k) ? 0 : counts[k] / total) : 0; }
  const from = { ...state.cur };
  const t0 = performance.now();
  const DUR = 350;
  if (state.raf) cancelAnimationFrame(state.raf);

  const step = now => {
    let e = Math.min(1, (now - t0) / DUR);
    e = 1 - Math.pow(1 - e, 3);  // easeOutCubic
    for (const k of keys) state.cur[k] = from[k] + (target[k] - from[k]) * e;
    $(svgId).innerHTML = pieSvg(keys.map(k => [k, state.cur[k] || 0]), color, label);
    if (e < 1) { state.raf = requestAnimationFrame(step); } else { state.raf = null; }
  };
  state.raf = requestAnimationFrame(step);
}

// Pie markup for [key, weight] pairs — shared by both toggleable pies.
function pieSvg(pairs, color, label) {
  const cx = 100, cy = 100, rad = 96;
  const parts = pairs.filter(([, f]) => f > 0.0005);
  const sum = parts.reduce((s, [, f]) => s + f, 0);
  if (sum < 0.0005) return `<circle cx="100" cy="100" r="96" fill="#1b1d23"/>`;
  // A single slice at ~100% can't be drawn as an arc (start==end) — use a circle.
  if (parts.length === 1) {
    return `<circle cx="100" cy="100" r="96" fill="${color[parts[0][0]]}"/>` + pieLabel(cx, cy - 40, "100%");
  }
  let angle = -Math.PI / 2;  // 12 o'clock
  let out = "";
  const labels = [];
  for (const [k, f] of parts) {
    const frac = f / sum;
    const end = angle + frac * 2 * Math.PI;
    const large = frac > 0.5 ? 1 : 0;
    const x1 = cx + rad * Math.cos(angle), y1 = cy + rad * Math.sin(angle);
    const x2 = cx + rad * Math.cos(end), y2 = cy + rad * Math.sin(end);
    out += `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${rad},${rad} 0 ${large},1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${color[k]}"><title>${escapeHtml(label(k))}: ${Math.round(frac * 100)}%</title></path>`;
    if (frac >= 0.06) {
      const mid = angle + frac * Math.PI;
      const lr = rad * 0.6;
      labels.push(pieLabel(cx + lr * Math.cos(mid), cy + lr * Math.sin(mid), `${Math.round(frac * 100)}%`));
    }
    angle = end;
  }
  return out + labels.join("");
}

function pieLabel(x, y, text) {
  return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" fill="#fff" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" style="pointer-events:none">${text}</text>`;
}

// Weekday×hour heatmap of ALL reported files' upload times in the selected period.
function renderHeatmap(recs) {
  const grid = Array.from({ length: 7 }, () => new Array(24).fill(0));
  let max = 0;
  for (const r of recs) {
    for (const ts of r.upload_times || []) {
      const d = new Date(ts * 1000);
      const v = ++grid[d.getDay()][d.getHours()];
      if (v > max) max = v;
    }
  }
  const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  let html = "<table><tr><td class='day'></td>";
  for (let h = 0; h < 24; h++) html += `<th class="hh">${h}</th>`;
  html += "</tr>";
  for (let d = 0; d < 7; d++) {
    html += `<tr><td class="day">${days[d]}</td>`;
    for (let h = 0; h < 24; h++) {
      const n = grid[d][h];
      const alpha = max ? 0.12 + 0.88 * (n / max) : 0;
      const bg = n ? `rgba(58,109,240,${alpha.toFixed(3)})` : "#1b1d23";
      html += `<td class="cell" style="background:${bg}" title="${days[d]} ${h}:00 — ${n}"></td>`;
    }
    html += "</tr>";
  }
  html += "</table>";
  $("st-heat").innerHTML = max ? html : `<div class="muted">No upload-time data for this period.</div>`;
}

tryAutoUnlock();
</script>
